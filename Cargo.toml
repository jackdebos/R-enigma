[workspace]
resolver = "2"
members = ["crates/enigma-core", "crates/enigma-cli", "crates/enigma-gpu"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.97.0"

[workspace.dependencies]
enigma-core = { path = "crates/enigma-core" }
enigma-gpu = { path = "crates/enigma-gpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The hot loop measures nanoseconds per decrypted letter (see docs/protocol.md §7
# and the Stage 1 risk table). Debug builds are for correctness only.
lto = "thin"
codegen-units = 1
panic = "abort"

# GPU device tests compile one specialized shader per job shape; the shader
# translator dominates their debug-build time unless it is optimized.
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
